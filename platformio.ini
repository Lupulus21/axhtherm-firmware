; AxHTherm 2.5 — firmware riscritto da zero
; Board: WEMOS D1 mini (ESP8266, 4 MB flash), layout 4M2M: 1 MB sketch + 1 MB OTA + ~2 MB LittleFS
[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
build_flags =
  -Wall
  -DAX_FW_VERSION=\"3.17.3\"
  ; minimo storico dell'heap misurato dall'allocatore (HeapMon): pochi byte di DRAM.
  ; UMM_INFO va dichiarato a mano: con UMM_STATS_FULL il core non lo attiva piu' da solo,
  ; e senza spariscono ESP.getMaxFreeBlockSize() e getHeapFragmentation().
  -DUMM_STATS_FULL
  -DUMM_INFO
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
  knolleary/PubSubClient@^2.8
extra_scripts =
  pre:tools/gzip_assets.py
  pre:tools/build_id.py

; Unit test del motore di controllo (lib/axcore, C++ puro) sull'host
[env:native]
platform = native
test_build_src = false
build_flags = -std=c++17 -Wall -DAX_NATIVE
