; AxHTherm 2.5 — firmware riscritto da zero
; Board: WEMOS D1 mini (ESP8266, 4 MB flash), layout 4M2M: 1 MB sketch + 1 MB OTA + ~2 MB LittleFS
[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
build_flags =
  -Wall
  -DAX_FW_VERSION=\"3.0.0\"
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
  knolleary/PubSubClient@^2.8
extra_scripts = pre:tools/gzip_assets.py

; Due camere di fermentazione. AX_N_CHAMBERS dimensiona array a TEMPO DI COMPILAZIONE
; (ChamberCtx[], probeId[], la mappa delle uscite): renderlo configurabile a runtime
; vorrebbe dire allocazione dinamica su uno heap di ~17 KB, cioe' peggiorare proprio il
; vincolo che il progetto sorveglia. Resta quindi un flag di build, ma con un environment
; dedicato invece di una variabile d'ambiente: cosi' e' riproducibile e verificabile.
;   ~/.venvs/platformio/bin/pio run -e d1_mini_2ch
; PRIMA di usarlo leggi docs/COLLAUDO_2CAMERE.md: serve il MCP23008 montato, e il formato
; di /state.json cambia in modo NON reversibile.
[env:d1_mini_2ch]
extends = env:d1_mini
build_flags =
  ${env:d1_mini.build_flags}
  -DAX_N_CHAMBERS=2

; Unit test del motore di controllo (lib/axcore, C++ puro) sull'host
[env:native]
platform = native
test_build_src = false
build_flags = -std=c++17 -Wall -DAX_NATIVE
